<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxaura - Gestão Financeira & Investimentos</title>
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">⚡ Fluxaura</a>
      <span class="navbar-text text-white-50 fs-6">Controle Financeiro & Investimentos</span>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm border-start border-4 border-primary">
          <div class="card-body">
            <h6 class="text-muted text-uppercase fw-normal mb-1 fs-7">Saldo Atual</h6>
            <h3 class="fw-bold text-dark mb-0" id="card-saldo">R$ 0,00</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm border-start border-4 border-danger">
          <div class="card-body">
            <h6 class="text-muted text-uppercase fw-normal mb-1 fs-7">Despesas do Mês</h6>
            <h3 class="fw-bold text-danger mb-0" id="card-despesas">R$ 0,00</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm border-start border-4 border-success">
          <div class="card-body">
            <h6 class="text-muted text-uppercase fw-normal mb-1 fs-7">Total Investido</h6>
            <h3 class="fw-bold text-success mb-0" id="card-investimentos">R$ 0,00</h3>
          </div>
        </div>
      </div>
    </div>
    <ul class="nav nav-pills mb-3" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-bold" id="gastos-tab" data-bs-toggle="pill" data-bs-target="#gastos" type="button" role="tab">
          <i class="bi bi-wallet2 me-1"></i> Controle de Gastos
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-bold" id="investimentos-tab" data-bs-toggle="pill" data-bs-target="#investimentos" type="button" role="tab">
          <i class="bi bi-graph-up-arrow me-1"></i> Carteira de Investimentos
        </button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabsContent">
      
      <!-- ABA 1: CONTROLE DE GASTOS -->
      <div class="tab-pane fade show active" id="gastos" role="tabpanel">
        <div class="row g-4">
          <!-- Formulário -->
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white fw-bold py-3">Nova Transação</div>
              <div class="card-body">
                <form id="form-transacao">
                  <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <input type="text" id="gasto-descricao" class="form-control" placeholder="Ex: Supermercado" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" id="gasto-valor" class="form-control" placeholder="0.00" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <select id="gasto-tipo" class="form-select">
                      <option value="despesa">Despesa</option>
                      <option value="receita">Receita</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <select id="gasto-categoria" class="form-select">
                      <option value="Alimentação">Alimentação</option>
                      <option value="Moradia">Moradia</option>
                      <option value="Transporte">Transporte</option>
                      <option value="Salário">Salário</option>
                      <option value="Outros">Outros</option>
                    </select>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 fw-bold">Adicionar Lancamento</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Tabela -->
          <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white fw-bold py-3">Histórico de Transações</div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th class="text-end">Ação</th>
                      </tr>
                    </thead>
                    <tbody id="tabela-transacoes">
                      <!-- Inserido dinamicamente pelo JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ABA 2: INVESTIMENTOS -->
      <div class="tab-pane fade" id="investimentos" role="tabpanel">
        <div class="row g-4">
          <!-- Formulário -->
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white fw-bold py-3">Novo Investimento</div>
              <div class="card-body">
                <form id="form-investimento">
                  <div class="mb-3">
                    <label class="form-label">Nome do Ativo / Título</label>
                    <input type="text" id="inv-nome" class="form-control" placeholder="Ex: Tesouro Selic, PETR4, Bitcoin" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Classe do Ativo</label>
                    <select id="inv-classe" class="form-select">
                      <option value="Renda Fixa">Renda Fixa</option>
                      <option value="Ações">Ações</option>
                      <option value="FIIs">FIIs (Fundos Imobiliários)</option>
                      <option value="Cripto">Criptomoedas</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Valor Aportado (R$)</label>
                    <input type="number" step="0.01" id="inv-valor" class="form-control" placeholder="0.00" required>
                  </div>
                  <button type="submit" class="btn btn-success w-100 fw-bold">Registrar Aporte</button>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white fw-bold py-3">Minha Carteira</div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Ativo</th>
                        <th>Classe</th>
                        <th>Total Investido</th>
                        <th class="text-end">Ação</th>
                      </tr>
                    </thead>
                    <tbody id="tabela-investimentos">
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
